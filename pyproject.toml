[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-engine"
version = "1.0.0.dev0"
description = "Screens North American equities for quality businesses priced for overly pessimistic expectations."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "yahooquery>=2.3",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["data*", "screen*", "value*", "monitor*", "reports*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
